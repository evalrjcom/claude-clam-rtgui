name: build-binaries
# Builds the release binaries and uploads them as workflow artifacts (and to a draft GitHub release when a v* tag is pushed).
# Does not need ClamAV: ClamGUI and clamrt only drive / talk to it at run time.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions: { contents: read }
concurrency: { group: "build-${{ github.ref }}", cancel-in-progress: true }

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: tools/check_versions.sh
      - run: sudo apt-get update && sudo apt-get install -y g++ cmake libfltk1.3-dev libx11-dev libxft-dev libxinerama-dev libxcursor-dev libxfixes-dev
      - run: tools/build_clamgui.sh linux          # -Wall -Wextra -Werror
      - run: tools/build_clamrt.sh linux
      - run: cd build/out && sha256sum * > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with: { name: linux-x86_64, path: build/out, retention-days: 30 }

  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake mingw-w64 git
      - uses: actions/cache@v4
        id: fltk
        with: { path: build/fltk_win, key: "fltk-win-${{ hashFiles('deps.env','tools/build_fltk_win.sh','tools/fetch_deps.sh') }}" }
      - if: steps.fltk.outputs.cache-hit != 'true'
        run: tools/build_fltk_win.sh
      - run: tools/build_clamgui.sh win             # static, -mwindows, -Werror
      - run: tools/build_clamrt.sh win
      - run: cd build/out && sha256sum * > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with: { name: windows-x64, path: build/out, retention-days: 30 }

  smoke-windows:                                    # really run the .exe on Windows (version + hashing, no ClamAV needed)
    needs: windows
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: windows-x64, path: build/out }
      - run: |
          v=$(. tools/lib.sh; gui_ver)
          G=build/out/clamgui_v${v}_win64.exe
          "$G" --version | grep -q "ClamGUI v$v"
          echo hello > t.txt
          [ "$("$G" --sha256 t.txt | cut -d' ' -f1)" = "$(sha256sum t.txt | cut -d' ' -f1)" ]

  release:                                          # tag v* -> draft release with both platforms' binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, smoke-windows]
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - run: |
          cd dist && mkdir -p all && cp linux-x86_64/* windows-x64/* all/ && cd all && cat SHA256SUMS-*.txt | sort -u > SHA256SUMS && rm SHA256SUMS-*.txt
      - uses: softprops/action-gh-release@v2
        with: { draft: true, files: dist/all/*, generate_release_notes: true }
